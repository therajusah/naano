# Local Postgres for the Naano clone.
# Runs isolated on host port 5544 (5432/5433/5435 were already taken on this machine).
# Start:  docker compose up -d
# Stop:   docker compose down
# Wipe:   docker compose down -v
services:
  postgres:
    image: postgres:16-alpine
    container_name: naano_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: naano
      POSTGRES_PASSWORD: naano_dev_password
      POSTGRES_DB: naano
    ports:
      - "5544:5432"
    volumes:
      - naano_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naano -d naano"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  naano_pgdata:
